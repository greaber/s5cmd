name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Check formatting
        run: test -z "$(git ls-files '*.go' ':!:vendor/**' | xargs gofmt -l)"
